<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web System</title>
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External Logic Script -->
    <script src="./login.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-white tracking-tight">System Login</h1>
            <p class="text-xs text-slate-400 mt-1">Enter your credentials to access your session.</p>
        </header>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="login-username" required
                    class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <div>
                <label for="login-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="login-password" required
                    class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>

            <div id="login-error" class="hidden text-xs text-rose-400 font-medium"></div>

            <button type="submit"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm transition active:scale-95 shadow-md shadow-indigo-600/20">
                Log In
            </button>
        </form>

        <footer class="mt-6 pt-4 border-t border-slate-700 text-center">
            <p class="text-xs text-slate-400">
                Don't have an account? 
                <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-semibold underline underline-offset-2">Register here</a>
            </p>
        </footer>
    </div>

</body>
</html>
